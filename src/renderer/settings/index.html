<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;"
    />
    <title>HeadsUp</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar">

        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search" />
        </label>

        <div class="summary-grid">
          <button id="filter-all" class="summary-card active" type="button">
            <span class="summary-icon all">✓</span>
            <span>All</span>
            <strong id="all-count">0</strong>
          </button>
          <button id="filter-today" class="summary-card" type="button">
            <span class="summary-icon today">•</span>
            <span>Today</span>
            <strong id="today-count">0</strong>
          </button>
        </div>

        <section class="side-section">
          <h2>Projects</h2>
          <div id="projects" class="project-list"></div>
        </section>

        <button id="open-settings" class="settings-link" type="button"><span aria-hidden="true">⚙</span> Settings</button>
      </aside>

      <main class="content">
        <header id="content-head" class="content-head">
          <div>
            <h1 id="view-title">All</h1>
            <p><span id="completed-count">0</span> Completed <span class="dot">·</span> <button id="clear-completed" type="button">Clear</button></p>
          </div>
        </header>

        <section id="editor" class="editor">
          <div class="editor-head">
            <div>
              <span id="editor-kind-label" class="section-label">Reminder</span>
              <h2>Schedule a flight</h2>
            </div>
            <button id="cancel-edit" type="button">Cancel</button>
          </div>

          <div class="editor-grid">
            <label class="field title-field">
              <span>Title</span>
              <input id="item-title" type="text" placeholder="What should fly across your screen?" />
            </label>
            <label class="field">
              <span>When</span>
              <input id="item-due" type="datetime-local" />
            </label>
            <label class="field">
              <span>List</span>
              <input id="item-project" type="text" placeholder="Reminders" />
            </label>
            <label class="field note-field">
              <span>Note</span>
              <textarea id="item-note" rows="3" placeholder="Optional detail"></textarea>
            </label>
          </div>

          <div class="editor-actions">
            <button id="save-item" class="primary" type="button">Save Reminder</button>
            <button id="test-flight" type="button">Send test flight</button>
          </div>
          <p id="form-error" class="form-error hidden"></p>
        </section>

        <section id="settings-panel" class="settings-panel hidden">
          <div class="settings-head">
            <div>
              <span class="section-label">Settings</span>
              <h2>Flight look</h2>
            </div>
            <button id="close-settings" type="button">Done</button>
          </div>
          <div class="settings-group">
            <h3>Banner style</h3>
            <div id="banner-options" class="option-grid"></div>
          </div>
          <div class="settings-group">
            <h3>Avatar</h3>
            <div id="avatar-options" class="option-grid avatar-grid"></div>
          </div>
        </section>

        <section id="list-section" class="list-section">
          <h2>Reminders</h2>
          <div id="reminder-list" class="item-list"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
